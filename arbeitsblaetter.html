<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnetismus Arbeitsblätter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --desk:#EEF1ED; --paper:#FFFFFF; --grid:rgba(40,70,120,.07);
  --ink:#1B2226; --muted:#5A656B; --line:#D5DAD5; --soft:#F4F6F3;
  --north:#D1382B; --south:#1F8A5B; --copper:#B8672C; --copper-lt:#EFC39A; --iron:#A9B1B4;
  --pen:#2743A6; --pen-soft:#E3E8F8; --on-pen:#FFFFFF;
  --sol:#C8246A; --sol-soft:#FBE3EE;
  --ok:#1F8A5B; --ok-bg:#E2F3EA; --bad:#C23324; --bad-bg:#FBE5E2;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px -14px rgba(20,40,60,.3);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#101518; --paper:#1B2226; --grid:rgba(140,170,220,.07);
    --ink:#E8ECEA; --muted:#9AA6AB; --line:#333D42; --soft:#232B30;
    --north:#F0645A; --south:#3DBB84; --copper:#E08A48; --copper-lt:#6E4424; --iron:#58636A;
    --pen:#8FA6FF; --pen-soft:#27305A; --on-pen:#10163A;
    --sol:#FF6FAE; --sol-soft:#3F1C2E;
    --ok:#3DBB84; --ok-bg:#16352A; --bad:#F0645A; --bad-bg:#3E1F1C;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#101518; --paper:#1B2226; --grid:rgba(140,170,220,.07);
  --ink:#E8ECEA; --muted:#9AA6AB; --line:#333D42; --soft:#232B30;
  --north:#F0645A; --south:#3DBB84; --copper:#E08A48; --copper-lt:#6E4424; --iron:#58636A;
  --pen:#8FA6FF; --pen-soft:#27305A; --on-pen:#10163A;
  --sol:#FF6FAE; --sol-soft:#3F1C2E;
  --ok:#3DBB84; --ok-bg:#16352A; --bad:#F0645A; --bad-bg:#3E1F1C;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--desk);padding-block:12px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:1.2rem;font-weight:800}
.top a{color:var(--pen);font-weight:700;font-size:.9rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.tab .pc{color:var(--ok);font-weight:700}
.tab[aria-selected="true"] .pc{color:inherit}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.85rem;color:var(--muted)}
.prog .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--pen);transition:width .3s}

.card{margin-top:14px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 20px;display:grid;gap:14px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.eyebrow.learn{color:var(--pen)}
.card h2{font-size:1.45rem}
.card p{margin:0}
.card ul,.card ol{margin:0;padding-left:1.3rem;display:grid;gap:.5rem}
.card li::marker{color:var(--pen);font-weight:700}
.orig{font-size:.88rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.orig b{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block}
.qs{font-size:1.2rem;font-weight:700;line-height:1.35}
.merk{background:var(--pen-soft);border-radius:10px;padding:12px 14px}
.merk b.h{display:block;color:var(--pen);font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.f{font-family:var(--mono);font-weight:700;color:var(--pen);white-space:nowrap}
.big{font-family:var(--mono);font-weight:700;font-size:1.3rem;color:var(--pen);text-align:center;padding:8px;background:var(--paper);border:2px solid var(--pen);border-radius:10px}
.pic{display:flex;justify-content:center}
.pic svg{width:100%;max-width:400px;height:auto}
.n{color:var(--north);font-weight:800} .s{color:var(--south);font-weight:800}
.steps{counter-reset:st;list-style:none;padding:0!important}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:var(--mono)}
table.tt{border-collapse:collapse;font-size:.92rem;width:100%}
table.tt td,table.tt th{border:1px solid var(--line);padding:6px 8px;text-align:left;background:var(--paper)}
.scroll{overflow-x:auto}

.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:12px 14px;border:2px solid;display:grid;gap:8px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:1.1rem}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.write{background:var(--paper);border-left:4px solid var(--sol);border-radius:0 8px 8px 0;padding:8px 12px}
.write b.h{display:block;color:var(--sol);font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--pen);color:var(--on-pen)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}

.fig{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px}
.fig .cap{font-size:.82rem;color:var(--muted);font-weight:700}
.fwrap svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.chip{cursor:pointer}
.chip .bg{fill:var(--paper);stroke:var(--pen);stroke-width:2}
.chip:hover .bg{fill:var(--pen-soft)}
.chip.ok .bg{stroke:var(--ok);stroke-width:3;fill:var(--ok-bg)}
.chip.bad .bg{stroke:var(--bad);stroke-width:3;fill:var(--bad-bg)}
.zone{cursor:pointer}
.zone rect{fill:transparent;stroke:var(--pen);stroke-width:1.5;stroke-dasharray:4 4}
.zone.on rect{fill:var(--pen-soft);stroke-dasharray:0}
.zone.ok rect{stroke:var(--ok);stroke-width:3}
.zone.bad rect{stroke:var(--bad);stroke-width:3}
.zone text{fill:var(--pen);font-size:11px;font-weight:700;font-family:var(--body)}
g.solg{display:none}
.fig.showsol g.solg{display:inline}
.fig.showsol .chip,.fig.showsol .zone{opacity:.35}
.done{text-align:center}
.done .stars{font-size:2.6rem;letter-spacing:6px;color:var(--line)}
.done .stars .on{color:var(--copper)}
.done .nav{justify-content:center}
@media (max-width:480px){ body{font-size:17px} .card{padding:14px 14px 16px} .qs{font-size:1.1rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1>Arbeitsblätter Schritt für Schritt</h1>
      <a href="https://claude.ai/artifact/NitAc1VHpBqur5WJqxFm22" target="_blank" rel="noopener">Zum Quiz-Spiel ↗</a>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="prog"><span id="prog-t"></span><span class="bar"><i id="prog-b"></i></span></div>
  </header>
  <main id="main"></main>
</div>
<script>
/* ================= Zeichen-Bausteine ================= */
function cond(cx,cy,r,dir){ // dir -1 = ⊗ hinein, +1 = ⊙ heraus
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--copper-lt)" stroke="var(--copper)" stroke-width="2.5"/>`;
  if(dir<0){const d=r*.55; s+=`<path d="M${cx-d} ${cy-d}L${cx+d} ${cy+d}M${cx+d} ${cy-d}L${cx-d} ${cy+d}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;}
  else s+=`<circle cx="${cx}" cy="${cy}" r="${Math.max(2.5,r*.22)}" fill="var(--ink)"/>`;
  return s;
}
function pole(x,y,w,h,p,fs=20){
  const c=p==='N'?'var(--north)':p==='S'?'var(--south)':'var(--iron)';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"/>`+(p?`<text x="${x+w/2}" y="${y+h/2+fs*.36}" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="${fs}" fill="#fff">${p}</text>`:'');
}
// Pfeilspitze (Winkel) an Punkt x,y in Richtung u/r/d/l
function head(x,y,d,col='var(--sol)',s=7){
  const rot={r:0,d:90,l:180,u:-90}[d];
  return `<path d="M${-s} ${-s}L0 0L${-s} ${s}" transform="translate(${x} ${y}) rotate(${rot})" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function ring(cx,cy,r,cw,col='var(--sol)',sw=2){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/>`+head(cx,cy-r,cw?'r':'l',col,5)+head(cx,cy+r,cw?'l':'r',col,5);
}
function arrow(x1,y1,x2,y2,col='var(--sol)',sw=3){
  const d=Math.abs(x2-x1)>Math.abs(y2-y1)?(x2>x1?'r':'l'):(y2>y1?'d':'u');
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`+head(x2,y2,d,col,7);
}
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-family="Atkinson Hyperlegible,sans-serif" font-size="12" fill="var(--muted)" ${o}>${t}</text>`;
const faint=d=>`<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 4" opacity=".6"/>`;
const solp=d=>`<path d="${d}" fill="none" stroke="var(--sol)" stroke-width="2.4"/>`;

// Physik: F = I × B, I = (0,0,Iz), B = (bx,by) im Bild mit y nach oben
function forceDir(I,B){ const fx=-I*B[1], fy=I*B[0]; return fx>0?'r':fx<0?'l':fy>0?'u':'d'; }
const DN={u:'nach oben',d:'nach unten',l:'nach links',r:'nach rechts'};

/* Chip-Inhalt je Zustand */
function chipGlyph(v){
  if(v==='?') return `<text y="5" text-anchor="middle" font-size="15" font-weight="700" fill="var(--muted)" font-family="JetBrains Mono,monospace">?</text>`;
  if('urdl'.includes(v)&&v.length===1){const r={r:0,d:90,l:180,u:-90}[v];return `<path d="M-8 0H6M1 -5L7 0L1 5" transform="rotate(${r})" fill="none" stroke="var(--pen)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;}
  if(v==='cw'||v==='ccw'){return `<g transform="${v==='ccw'?'scale(-1,1)':''}"><path d="M-7 0A7 7 0 1 1 0 7" fill="none" stroke="var(--pen)" stroke-width="2.4"/><path d="M4 3.5L0 7L4 10.5" fill="none" stroke="var(--pen)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>`;}
  if(v==='N'||v==='S') return `<text y="6" text-anchor="middle" font-size="17" font-weight="800" font-family="Bricolage Grotesque,sans-serif" fill="${v==='N'?'var(--north)':'var(--south)'}">${v}</text>`;
  return `<text y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--pen)" font-family="Atkinson Hyperlegible,sans-serif">${v}</text>`;
}
const CYC={dir:['?','r','l'],vert:['?','u','d'],rot:['?','cw','ccw'],pole:['?','N','S'],force:['?','u','r','d','l']};
/* ================= Abbildungen ================= */
const FIG={};
FIG.stab=()=>({w:360,h:240,cap:'Bild 1: Stabmagnet',
  base: faint('M125 105C125 55 235 55 235 105')+faint('M122 105C105 10 255 10 238 105')+faint('M125 135C125 185 235 185 235 135')+faint('M122 135C105 230 255 230 238 135')
    +`<rect x="120" y="105" width="60" height="30" fill="var(--north)"/><rect x="180" y="105" width="60" height="30" fill="var(--south)"/>`
    +`<text x="138" y="127" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="18" fill="#fff">N</text><text x="211" y="127" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="18" fill="#fff">S</text>`,
  sol: solp('M125 105C125 55 235 55 235 105')+solp('M122 105C105 10 255 10 238 105')+solp('M125 135C125 185 235 185 235 135')+solp('M122 135C105 230 255 230 238 135')
    +head(184,67.5,'r')+head(184,34,'r')+head(184,172.5,'r')+head(184,206,'r')
    +`<line x1="232" y1="120" x2="128" y2="120" stroke="var(--sol)" stroke-width="2.4" stroke-dasharray="5 3"/>`+head(160,120,'l'),
  chips:[{k:'o1',x:180,y:67,c:'dir',a:'r'},{k:'o2',x:180,y:34,c:'dir',a:'r'},{k:'o3',x:180,y:173,c:'dir',a:'r'},{k:'o4',x:180,y:206,c:'dir',a:'r'},{k:'in',x:180,y:120,c:'dir',a:'l'}],
  explain:'Außen laufen die Feldlinien von N nach S (hier nach rechts), innen im Magneten von S nach N zurück (nach links). Sie sind geschlossen und treten senkrecht aus.'
});
FIG.hufeisen=()=>({w:320,h:240,cap:'Bild 2: Hufeisenmagnet mit Eisen',
  base:`<rect x="60" y="80" width="40" height="80" fill="var(--iron)"/>`+pole(60,40,110,40,'N')+pole(60,160,110,40,'S')+pole(220,30,30,180,'')
    +T(258,124,'Eisen')+faint('M170 60H235V180H170'),
  sol: solp('M170 60H235V180H170')+`<path d="M140 180H80V60H140" fill="none" stroke="var(--sol)" stroke-width="2.4" stroke-dasharray="5 3"/>`+head(200,60,'r')+head(235,125,'d')+head(195,180,'l')+head(80,110,'u'),
  chips:[{k:'g1',x:195,y:60,c:'dir',a:'r'},{k:'fe',x:235,y:120,c:'vert',a:'d'},{k:'g2',x:195,y:180,c:'dir',a:'l'},{k:'mg',x:80,y:120,c:'vert',a:'u'}],
  explain:'Die Feldlinien gehen vom Nordpol durch den Luftspalt ins Eisen, durch das Eisen nach unten, über den unteren Spalt zum Südpol und im Magneten von S nach N zurück. Eisen leitet die Feldlinien gut.'
});
FIG.leiter=()=>({w:360,h:220,cap:'Bild 1: Stromdurchflossene Leiter',
  base:[35,55,75].map(r=>`<circle cx="100" cy="115" r="${r}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/><circle cx="260" cy="115" r="${r}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/>`).join('')
    +cond(100,115,16,-1)+cond(260,115,16,1)+T(100,212,'hinein',`text-anchor="middle"`)+T(260,212,'heraus',`text-anchor="middle"`),
  sol:[35,55,75].map(r=>ring(100,115,r,true)+ring(260,115,r,false)).join(''),
  chips:[{k:'a',x:100,y:40,c:'rot',a:'cw'},{k:'b',x:260,y:40,c:'rot',a:'ccw'}],
  explain:'Rechte Faust: Daumen in Stromrichtung, Finger zeigen die Feldrichtung. ⊗ (hinein) → im Uhrzeigersinn, ⊙ (heraus) → gegen den Uhrzeigersinn. Die Kreise werden nach außen weiter auseinander.'
});
FIG.schleife=()=>({w:360,h:230,cap:'Bild 2: Leiterschleife (Windung)',
  base:`<path d="M110 170A70 70 0 0 1 250 170" fill="none" stroke="var(--copper-lt)" stroke-width="16"/><path d="M110 170A70 70 0 0 1 250 170" fill="none" stroke="var(--copper)" stroke-width="1.5"/>`
    +[28,45].map(r=>`<circle cx="110" cy="170" r="${r}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/><circle cx="250" cy="170" r="${r}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/>`).join('')
    +cond(110,170,13,1)+cond(250,170,13,-1),
  sol:[28,45].map(r=>ring(110,170,r,false)+ring(250,170,r,true)).join('')+arrow(180,210,180,130),
  chips:[{k:'l',x:48,y:170,c:'rot',a:'ccw'},{k:'r',x:312,y:170,c:'rot',a:'cw'},{k:'m',x:180,y:170,c:'vert',a:'u'}],
  explain:'Links ⊙ → gegen den Uhrzeigersinn, rechts ⊗ → im Uhrzeigersinn. Zwischen den beiden Leitern zeigen beide Felder in dieselbe Richtung (nach oben) und verstärken sich.'
});
FIG.spule=()=>{
  let b=''; const xs=[90,126,162,198,234,270];
  xs.forEach((x,i)=>{ if(i<5) b+=`<line x1="${x}" y1="160" x2="${x+36}" y2="80" stroke="var(--copper)" stroke-width="1.5" opacity=".6"/>`; });
  xs.forEach(x=>{ b+=cond(x,80,12,1)+cond(x,160,12,-1); });
  return {w:360,h:240,cap:'Bild 3: Magnetfeld einer Spule',
    base:b+T(20,230,'oben: ⊙ heraus · unten: ⊗ hinein'),
    sol:`<line x1="70" y1="120" x2="290" y2="120" stroke="var(--sol)" stroke-width="2.4"/>`+head(240,120,'r')
      +solp('M290 120C345 120 345 30 180 30C15 30 15 120 70 120')+head(176,30,'l')
      +solp('M290 120C345 120 345 210 180 210C15 210 15 120 70 120')+head(176,210,'l')
      +ring(126,80,20,false)+ring(126,160,20,true),
    chips:[{k:'pl',x:32,y:120,c:'pole',a:'S'},{k:'pr',x:328,y:120,c:'pole',a:'N'},{k:'in',x:180,y:120,c:'dir',a:'r'},{k:'t',x:126,y:40,c:'rot',a:'ccw'},{k:'u',x:126,y:200,c:'rot',a:'cw'}],
    explain:'Obere Leiter ⊙ → Feld gegen den Uhrzeigersinn, untere ⊗ → im Uhrzeigersinn. Innen addieren sich die Felder und zeigen nach rechts. Wo die Feldlinien austreten, ist der Nordpol (rechts), links ist der Südpol. Rechte Hand: Finger in Stromrichtung um die Spule, Daumen zeigt zum Nordpol.'
  };
};
FIG.ringspule=()=>{
  let b=`<circle cx="180" cy="120" r="70" fill="none" stroke="var(--iron)" stroke-width="26"/>`;
  for(let i=0;i<8;i++){const a=i*Math.PI/4+Math.PI/8; b+=cond(180+100*Math.cos(a),120+100*Math.sin(a),9,1)+cond(180+40*Math.cos(a),120+40*Math.sin(a),8,-1);}
  return {w:360,h:240,cap:'Bild 4: Ringspule (Eisenring als magnetischer Leiter)',
    base:b+T(292,30,'Eisenring'),
    sol:`<circle cx="180" cy="120" r="70" fill="none" stroke="var(--sol)" stroke-width="2.4" stroke-dasharray="6 4"/>`+head(180,50,'r')+head(180,190,'l')+head(250,120,'d')+head(110,120,'u'),
    chips:[{k:'c',x:180,y:120,c:'rot',a:'cw'}],
    explain:'Außen ⊙, innen ⊗. Im Eisenring verstärken sich beide Felder: Das Feld läuft im Uhrzeigersinn im Ring herum. Die Ringspule hat keine Pole nach außen.'
  };
};
function panel(topPole,I,cap){

  let b=pole(10,5,150,34,topPole,18)+pole(10,171,150,34,topPole==='N'?'S':'N',18);
  [28,52,118,142].forEach(x=>b+=faint(`M${x} 40V170`));
  b+=cond(85,105,15,I);
  const fx={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]}[F];
  return {w:170,h:210,cap,
    base:b,
    sol:ring(85,105,24,cw)+arrow(85+fx[0]*20,105+fx[1]*20,85+fx[0]*62,105+fx[1]*62)+`<text x="${85+fx[0]*64}" y="${fx[1]?105+fx[1]*64:92}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="14" fill="var(--sol)">F</text>`,
    zones:[{k:'L',x:13,y:44,w:52,h:122,g:'s',a:strong==='L',lab:'stärker?'},{k:'R',x:105,y:44,w:52,h:122,g:'s',a:strong==='R',lab:'stärker?'}],
    chips:[{k:'f',x:85,y:148,c:'force',a:F}],
    explain:`Feld von N nach S zeigt ${topPole==='N'?'nach unten':'nach oben'}. Leiterfeld: ${cw?'⊗ im Uhrzeigersinn':'⊙ gegen den Uhrzeigersinn'}. ${strong==='L'?'Links':'Rechts'} zeigen beide Felder gleich → verstärkt, ${strong==='L'?'rechts':'links'} geschwächt. Der Leiter wird zur schwachen Seite gedrückt: F ${DN[F]}. Rechte Hand: Daumen ${I<0?'ins Blatt':'aus dem Blatt'}, Zeigefinger ${topPole==='N'?'nach unten':'nach oben'} → Mittelfinger ${DN[F]}.`
  };

function emPanel(left,Il,Ir,cap){
  const B=[left==='N'?1:-1,0], Fl=forceDir(Il,B), Fr=forceDir(Ir,B);
  let b=pole(12,25,50,170,left,20)+pole(298,25,50,170,left==='N'?'S':'N',20);
  for(let i=0;i<4;i++){ b+=`<rect x="4" y="${60+i*28}" width="66" height="10" rx="5" fill="none" stroke="var(--copper)" stroke-width="2"/><rect x="290" y="${60+i*28}" width="66" height="10" rx="5" fill="none" stroke="var(--copper)" stroke-width="2"/>`; }
  [45,75,145,175].forEach(y=>b+=faint(`M70 ${y}H290`));
  b+=`<line x1="140" y1="110" x2="220" y2="110" stroke="var(--copper)" stroke-width="2" stroke-dasharray="3 3"/><text x="180" y="105" text-anchor="middle" font-size="16" fill="var(--muted)">+</text>`;
  b+=cond(140,110,15,Il)+cond(220,110,15,Ir);
  const v=d=>({u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[d]);
  const [a,c]=[v(Fl),v(Fr)];
  return {w:360,h:220,cap,
    base:b,
    sol:arrow(140+a[0]*20,110+a[1]*20,140+a[0]*55,110+a[1]*55)+arrow(220+c[0]*20,110+c[1]*20,220+c[0]*55,110+c[1]*55),
    chips:[{k:'l',x:108,y:150,c:'force',a:Fl},{k:'r',x:252,y:150,c:'force',a:Fr}],
    explain:`Feld von N nach S: ${left==='N'?'nach rechts':'nach links'}. Linker Leiter ${Il<0?'⊗':'⊙'} → F ${DN[Fl]}, rechter Leiter ${Ir<0?'⊗':'⊙'} → F ${DN[Fr]}. Die Kräfte zeigen in entgegengesetzte Richtungen, deshalb dreht sich die Schleife um die Achse (+). Das ist das Motorprinzip.`
  };
}

function poles(kind){

    let s=bar(20,'N','S')+bar(220,'N','S');

  let s=pole(20,40,60,34,'S',16)+pole(80,40,60,34,'N',16)+pole(220,40,60,34,'N',16)+pole(280,40,60,34,'S',16);
  s+=solp('M140 50C165 45 165 20 160 5')+solp('M220 50C195 45 195 20 200 5')+solp('M140 64C165 69 165 94 160 109')+solp('M220 64C195 69 195 94 200 109');

}

    <tr><td>Feldstärke</td><td><b>H</b></td><td>Durchflutung pro Länge: <span class="f">H = I · N / lₘ</span></td><td>A/m</td></tr>
    <tr><td>Flussdichte</td><td><b>B</b></td><td>wie dicht die Linien sind: <span class="f">B = Φ / A</span></td><td>T (Tesla)</td></tr></table></div>
    <p><b>lₘ</b> ist die mittlere Feldlinienlänge, also wie lang der Weg der Feldlinien ist. <b>A</b> ist die Fläche.</p>`),
  Q('Aufgabe 1','Was versteht man unter magnetischem Fluss?','Was ist der magnetische Fluss Φ?','Die Gesamtheit aller Feldlinien',['Der Strom in der Spule','Die Zahl der Windungen','Die Kraft auf einen Draht'],
    'Fluss = alle Feldlinien zusammen, also die „Menge“ des Magnetfelds.','Der magnetische Fluss ist die Gesamtheit aller Feldlinien eines Magneten.'),
  Q('Aufgabe 2','Ergänzen Sie Tabelle 1: Magnetischer Fluss (Formelzeichen, Einheitenzeichen, Einheitenname).','Welche Zeile ist richtig für den magnetischen Fluss?','Φ · Wb · Weber',['Θ · A · Ampere','B · T · Tesla','H · A/m · Ampere pro Meter'],
    'Der Fluss hat das Zeichen Φ und wird in Weber gemessen. 1 Wb = 1 Vs.','Formelzeichen: Φ · Einheitenzeichen: Wb · Einheitenname: Weber'),
  Q('Aufgabe 3','Nennen Sie die Formel für die Durchflutung einer Spule.','Wie rechnet man die Durchflutung Θ aus?','Θ = I · N',['Θ = I / N','Θ = U · I','Θ = B · A'],
    'Strom mal Windungszahl. Mehr Strom oder mehr Windungen machen die Spule stärker.','Θ = I · N'),
  L('Gleichwertige Spulen',`<p>Zwei Spulen sind gleich stark, wenn ihre <b>Durchflutung Θ gleich</b> ist.</p>
    <p>Spule a) hat 1 Windung und 10 A: <span class="f">Θ = 10 A · 1 = 10 A</span></p>
    <p>Jede andere Spule muss also auch <b>10 A</b> Durchflutung haben. Den Strom rechnest du so aus:</p>
    <div class="big">I = Θ / N</div>`+merk('Mehr Windungen → weniger Strom nötig.')),
  Q('Aufgabe 4b','Die drei Luftspulen sollen magnetisch gleichwertig sein. b) Spule mit 10 Windungen: I = ?','Spule mit 10 Windungen. Welcher Strom ist nötig?','1 A',['10 A','100 A','0,1 A'],
    'I = Θ / N = 10 A / 10 = 1 A','I = 10 A / 10 = 1 A'),
  Q('Aufgabe 4c','c) Spule mit 40 Windungen: I = ?','Spule mit 40 Windungen. Welcher Strom ist nötig?','0,25 A',['4 A','400 A','2,5 A'],
    'I = Θ / N = 10 A / 40 = 0,25 A','I = 10 A / 40 = 0,25 A'),
  Q('Aufgabe 5','Ergänzen Sie Tabelle 2: Durchflutung.','Welche Zeile ist richtig für die Durchflutung?','Θ · A · Ampere',['Φ · Wb · Weber','B · T · Tesla','Θ · V · Volt'],
    'Θ = I · N. Die Windungszahl hat keine Einheit, deshalb bleibt Ampere übrig.','Formelzeichen: Θ · Einheitenzeichen: A · Einheitenname: Ampere'),
  Q('Aufgabe 6','Nennen Sie die Formel für die magnetische Feldstärke H.','Wie rechnet man die Feldstärke H aus?','H = I · N / lₘ',['H = Φ / A','H = I · B · l','H = U / R'],
    'Die Durchflutung (I · N) wird auf die Länge lₘ verteilt.','H = I · N / lₘ'),
  L('Rechnen mit H: Schritt für Schritt',`<p>Aufgabe: H soll <b>4 A/cm</b> sein. lₘ = <b>12 cm</b>, N = <b>1000</b>. Welcher Strom I?</p>
    <ol class="steps"><li><span>Formel: <span class="f">H = I · N / lₘ</span></span></li>
    <li><span>Nach I umstellen: <span class="f">I = H · lₘ / N</span></span></li>
    <li><span>Einsetzen: <span class="f">I = 4 A/cm · 12 cm / 1000</span></span></li>
    <li><span>cm kürzt sich weg: 4 · 12 = 48, dann 48 / 1000 = <b>0,048 A</b></span></li></ol>`),
  Q('Aufgabe 7','Berechnen Sie den notwendigen Spulenstrom für H = 4 A/cm (lₘ = 12 cm, N = 1000).','Welcher Strom kommt heraus?','0,048 A (= 48 mA)',['48 A','333 A','0,48 A'],
    'I = H · lₘ / N = 4 A/cm · 12 cm / 1000 = 0,048 A. Wer 48 A hat, hat vergessen, durch 1000 zu teilen.','Geg.: H = 4 A/cm; lₘ = 12 cm; N = 1000 · Ges.: I<br>I = H · lₘ / N = 4 A/cm · 12 cm / 1000 = 0,048 A'),
  Q('Aufgabe 8','Nennen Sie die Formel für die magnetische Flussdichte B.','Wie rechnet man die Flussdichte B aus?','B = Φ / A',['B = Φ · A','B = I · N','B = A / Φ'],
    'Fluss geteilt durch Fläche. Einheit: Tesla (T).','B = Φ / A'),
  Q('Aufgabe 9','Vergleichen Sie die magnetische Flussdichte in den beiden Querschnittsflächen.','Der gleiche Fluss geht durch eine große und eine kleine Fläche. Wo ist B größer?','In der kleinen Fläche',['In der großen Fläche','Überall gleich'],
    'Gleich viele Feldlinien auf weniger Platz → sie liegen dichter → B ist größer.','Kleine Querschnittsfläche: große Flussdichte. Große Fläche: kleine Flussdichte.'),
  L('Umrechnen in Tesla',`<p>Auf dem Blatt steht: <span class="f">1 T = 1 · 10⁻⁴ Vs/cm²</span></p>
    <p>Das heißt: Einen Wert in Vs/cm² rechnest du in Tesla um, indem du mit <b>10⁴ = 10 000</b> malnimmst.</p>
    <p>Mit Zehnerpotenzen ist das leicht: Du rechnest einfach <b>+4 bei der Hochzahl</b>.</p>
    <p>Beispiel: 5 · 10⁻⁵ → Hochzahl −5 + 4 = −1 → 5 · 10⁻¹ T = <b>0,5 T</b></p>`),
  Q('Aufgabe 10','Erdmagnetismus: 5 · 10⁻⁹ Vs/cm² = ? T','Erdmagnetismus: 5 · 10⁻⁹ Vs/cm² sind wie viel Tesla?','5 · 10⁻⁵ T',['5 · 10⁻¹³ T','5 · 10⁻⁴ T','5 · 10⁴ T'],'Hochzahl: −9 + 4 = −5 → 5 · 10⁻⁵ T','5 · 10⁻⁵ T'),
  Q('Aufgabe 10','Pol am Dauermagnet: 5 · 10⁻⁵ Vs/cm² = ? T','Dauermagnet: 5 · 10⁻⁵ Vs/cm² sind wie viel Tesla?','0,5 T',['5 T','0,05 T','5 · 10⁻⁹ T'],'Hochzahl: −5 + 4 = −1 → 5 · 10⁻¹ T = 0,5 T','5 · 10⁻¹ T = 0,5 T'),
  Q('Aufgabe 10','Pol am Elektromagnet: 3 · 10⁻⁴ Vs/cm² = ? T','Elektromagnet: 3 · 10⁻⁴ Vs/cm² sind wie viel Tesla?','3 T',['0,3 T','30 T','3 · 10⁻⁸ T'],'Hochzahl: −4 + 4 = 0 → 3 · 10⁰ T = 3 T','3 T'),
]},
{id:'b59',nr:'5.9',title:'Motorprinzip und 3-Finger-Regel',steps:[
  L('Was passiert hier?',`<p>Ein Draht mit Strom liegt zwischen den Polen eines Magneten. Dann wird der Draht <b>zur Seite gedrückt</b>.</p>
    <p>Diese Kraft heißt <b>Ablenkkraft F</b>. So funktioniert ein <b>Elektromotor</b>.</p>
    <p>In welche Richtung der Draht gedrückt wird, findest du mit der <b>Rechten-Hand-Regel</b> heraus (3-Finger-Regel).</p>`),
  L('Die 3-Finger-Regel (rechte Hand)',`<div class="pic">${handSVG}</div>
    <ol class="steps"><li><span><b>Daumen</b> in die <b>Stromrichtung</b>.<br>⊗ → Daumen zeigt vom Gesicht weg aufs Blatt. ⊙ → Daumen zeigt zu dir.</span></li>
    <li><span><b>Zeigefinger</b> in Richtung <b>Magnetfeld</b>, also von <span class="n">N</span> nach <span class="s">S</span>.</span></li>
    <li><span>Der <b>Mittelfinger</b> zeigt jetzt die <b>Kraft F</b>, also wohin der Draht gedrückt wird.</span></li></ol>`
    +merk('Daumen = Strom, Zeigefinger = Feld, Mittelfinger = Kraft.<br>Ursache – Vermittlung – Wirkung (U-V-W).')),
  L('Warum wird der Draht weggedrückt?',`<p>Der Draht hat sein <b>eigenes Feld</b> (Kreise). Das Magnetfeld zwischen N und S kommt dazu.</p>
    <ul><li>Auf einer Seite zeigen beide Felder <b>gleich</b> → das Feld wird <b>stärker</b> (verstärkt).</li>
    <li>Auf der anderen Seite zeigen sie <b>gegeneinander</b> → das Feld wird <b>schwächer</b>.</li></ul>
    <p>Der Draht wird von der starken Seite <b>zur schwachen Seite</b> gedrückt.</p>
    ${solved(panel('N',-1,'Beispiel'))}
    <p>Beispiel oben: Feld nach unten, Draht ⊗ dreht im Uhrzeigersinn. Rechts zeigen beide nach unten → verstärkt. Also wird der Draht <b>nach links</b> gedrückt.</p>`),
  F('Aufgabe 5a','Zeichnen Sie das entstehende Gesamtmagnetfeld ein. Tragen Sie Richtungspfeile für die Kraftwirkung ein.','Wo ist das Feld stärker? Und wohin zeigt F? Tippe die Seite und das ? an.',()=>panel('N',-1,'Bild 1a'),
    ['Feld von N nach S: <b>nach unten</b>. Kreuz ⊗ → Kreise im Uhrzeigersinn.','Rechts vom Draht zeigt der Kreis nach unten, genau wie das Magnetfeld → <b>rechts verstärkt</b>.','Der Draht wird zur schwachen Seite gedrückt → F <b>nach links</b>.']),
  F('Aufgabe 5a','Tragen Sie Richtungspfeile für die Kraftwirkung ein.','Bild 1b: Wo ist das Feld stärker? Wohin zeigt F?',()=>panel('S',1,'Bild 1b'),
    ['Jetzt ist <span class="s">S</span> oben: Feld von N nach S zeigt <b>nach oben</b>.','Punkt ⊙ → gegen den Uhrzeigersinn. Rechts vom Draht zeigt der Kreis nach oben → <b>rechts verstärkt</b>.','Also F <b>nach links</b>. 3-Finger-Probe: Daumen zu dir, Zeigefinger nach oben → Mittelfinger nach links.']),
  F('Aufgabe 5a','Tragen Sie Richtungspfeile für die Kraftwirkung ein.','Bild 1c: Wo ist das Feld stärker? Wohin zeigt F?',()=>panel('N',1,'Bild 1c'),
    ['Feld <b>nach unten</b> (N oben).','Punkt ⊙ → gegen den Uhrzeigersinn. Links vom Draht zeigt der Kreis nach unten → <b>links verstärkt</b>.','Also F <b>nach rechts</b>.']),
  F('Aufgabe 5a','Tragen Sie Richtungspfeile für die Kraftwirkung ein.','Bild 1d: Wo ist das Feld stärker? Wohin zeigt F?',()=>panel('S',-1,'Bild 1d'),
    ['Feld <b>nach oben</b> (S oben).','Kreuz ⊗ → im Uhrzeigersinn. Links vom Draht zeigt der Kreis nach oben → <b>links verstärkt</b>.','Also F <b>nach rechts</b>.']),
  F('Aufgabe 5b','Bild 2: Leiterschleife im Feld eines Elektromagneten. Tragen Sie die Kraftrichtungen ein.','Wohin wird jeder der beiden Drähte gedrückt?',()=>emPanel('S',1,-1,'Bild 2a'),
    ['Feld von N (rechts) nach S (links): <b>nach links</b>.','Linker Draht ⊙: Daumen zu dir, Zeigefinger nach links → Mittelfinger <b>nach unten</b>.','Rechter Draht ⊗: Daumen weg von dir → Mittelfinger <b>nach oben</b>.','Die beiden Kräfte zeigen gegeneinander → die Schleife <b>dreht sich</b>. Das ist der Motor!']),
  F('Aufgabe 5b','Tragen Sie die Kraftrichtungen ein.','Jetzt ist N links. Wohin werden die Drähte gedrückt?',()=>emPanel('N',1,-1,'Bild 2b'),
    ['Feld von N (links) nach S (rechts): <b>nach rechts</b>.','Linker Draht ⊙ → F <b>nach oben</b>. Rechter Draht ⊗ → F <b>nach unten</b>.','Die Schleife dreht sich jetzt andersherum.']),
  Q('Aufgabe 6','Von welchen zwei Ursachen wird die Richtung der Ablenkkraft bestimmt?','Wovon hängt ab, in welche Richtung der Draht gedrückt wird?','Von der Richtung des Magnetfelds und von der Stromrichtung',['Von der Dicke und Länge des Drahtes','Von Spannung und Widerstand','Nur von der Farbe der Pole'],
    'Dreht man den Strom ODER das Feld um, dreht sich die Kraft um. Dreht man beides um, bleibt sie gleich.','• Von der Richtung des fremden Magnetfeldes<br>• Von der Stromrichtung (eigenes Magnetfeld)'),
  Q('Aufgabe 7','Nennen Sie drei Einflussgrößen, welche die Kraft auf den Leiter verstärken.','Womit wird die Kraft größer?','Mehr Strom I · längerer Draht im Feld l · stärkeres Magnetfeld B',['Dickere Isolierung · mehr Farbe · kälterer Raum','Weniger Strom · kürzerer Draht · schwächerer Magnet','Höherer Widerstand · mehr Spannung · Holzkern'],
    'Das sind genau die drei Buchstaben aus der Formel F = I · B · l.','• größere Stromstärke I<br>• größere wirksame Leiterlänge l im Magnetfeld<br>• größere Flussdichte B'),
  Q('Aufgabe 8','Wie lautet die Formel zur Berechnung der Ablenkkraft?','Wie lautet die Formel für die Kraft?','F = I · B · l',['F = U · I','F = I · N','F = B / l'],
    'Kraft = Strom · Flussdichte · Länge. Merkhilfe: „F-I-B-L“, wie eine Fibel.','F = I · B · l'),
  Q('Aufgabe 9','Entwickeln Sie die Einheit der Kraft in N (Newton).','[F] = A · T · m. Was ist 1 Tesla, damit am Ende Newton herauskommt?','1 T = 1 N / (A · m)',['1 T = 1 V · s','1 T = 1 A / m','1 T = 1 N · m'],
    'A · N/(A·m) · m: Das A kürzt sich weg und das m auch. Übrig bleibt N.','[F] = A · T · m = A · N/(A·m) · m = N'),
  L('Rechnen mit F = I · B · l',`<ol class="steps"><li><span>Schreib auf, was gegeben ist (Geg.) und was gesucht ist (Ges.).</span></li>
    <li><span><b>Wichtig:</b> Die Länge muss in <b>Meter</b> sein. mm durch 1000 teilen! 20 mm = 0,02 m.</span></li>
    <li><span>Alles in die Formel einsetzen und ausrechnen.</span></li></ol>`),
  Q('Aufgabe 10','I = 5 A, B = 3 T, wirksame Leiterlänge 20 mm. Berechnen Sie die Kraft.','Wie groß ist F?','0,3 N',['300 N','15 N','0,03 N'],
    'F = 5 A · 3 T · 0,02 m = 0,3 N. Bei 300 N wurden die mm nicht in m umgerechnet. Bei 15 N wurde die Länge vergessen.','Geg.: I = 5 A; B = 3 T; l = 20 mm = 0,02 m · Ges.: F<br>F = I · B · l = 5 A · 3 T · 0,02 m = 0,3 N'),
  L('Formel umstellen: der Trick',`<p>Du willst eine Größe allein haben? Dann <b>teile durch die anderen beiden</b>.</p>
    <div class="big">F = I · B · l</div>
    <ul><li>I gesucht → <span class="f">I = F / (B · l)</span></li><li>B gesucht → <span class="f">B = F / (I · l)</span></li><li>l gesucht → <span class="f">l = F / (I · B)</span></li></ul>`),
  Q('Aufgabe 11a','Stellen Sie die Formel nach der Stromstärke um.','I = ?','F / (B · l)',['F · B · l','B · l / F','F / B'],'F durch die beiden anderen teilen.','I = F / (B · l)'),
  Q('Aufgabe 11b','… nach der Magnetflussdichte.','B = ?','F / (I · l)',['F · I · l','I · l / F','F / l'],'F durch die beiden anderen teilen.','B = F / (I · l)'),
  Q('Aufgabe 11c','… nach der wirksamen Leiterlänge.','l = ?','F / (I · B)',['F · I · B','I · B / F','F / I'],'F durch die beiden anderen teilen.','l = F / (I · B)'),
]},
{id:'tafel',nr:'Trafo 1',title:'Transformator: Grundlagen (Tafel)',steps:[
  L('Wie funktioniert ein Transformator?',`${solved(FIG.trafo())}
    <ol class="steps"><li><span>Die <b>Primärspule</b> (Eingang) bekommt <b>Wechselspannung</b>.</span></li>
    <li><span>Dadurch entsteht ein Magnetfeld, das sich <b>ständig ändert</b>.</span></li>
    <li><span>Der <b>Eisenkern</b> leitet das Feld zur <b>Sekundärspule</b> (Ausgang).</span></li>
    <li><span>Dort entsteht durch das sich ändernde Feld eine Spannung. Das heißt <b>Induktion</b>.</span></li></ol>`
    +merk('Ohne Änderung keine Induktion. Deshalb geht ein Trafo nur mit Wechselspannung.')),
  F('Tafel','Beschriften Sie den Transformator.','Tippe so lange auf die Felder, bis der richtige Name steht.',FIG.trafo,
    ['Links (Eingang) ist die <b>Primärspule</b>.','Rechts (Ausgang) ist die <b>Sekundärspule</b>.','Das graue Viereck ist der <b>Eisenkern</b>.']),
  Q('Tafel','Was versteht man unter Induktion?','Was ist Induktion?','Es entsteht eine Spannung in einem Leiter, weil sich das Magnetfeld ändert',['Ein Draht wird warm, weil Strom fließt','Zwei Magnete ziehen sich an','Man wickelt Draht um Eisen'],
    'Das Magnetfeld muss sich ändern, dann entsteht Spannung.','Induktion ist das Entstehen von Spannung in einem Leiter durch die Änderung des Magnetfeldes.'),
  L('Galvanische Trennung',`<p>Primärspule und Sekundärspule berühren sich <b>nicht</b>. Die Energie geht nur über das Magnetfeld hinüber.</p>
    <p>So hat man <b>zwei getrennte Stromkreise ohne direkte elektrische Verbindung</b>. Das nennt man <b>galvanische Trennung</b>.</p>
    <p>Ein <b>Optokoppler</b> trennt auch galvanisch. Er überträgt das Signal mit Licht.</p>`),
  Q('Tafel','Was versteht man unter galvanischer Trennung?','Was bedeutet galvanische Trennung?','Zwei getrennte Stromkreise ohne direkte elektrische Verbindung',['Ein Stromkreis ohne Sicherung','Zwei Drähte, die zusammengelötet sind','Ein Kurzschluss'],
    'Getrennt = kein Draht verbindet die beiden Seiten.','2 getrennte Stromkreise, die keine direkte elektrische Verbindung haben.'),
  L('Die Trafo-Formel',`<div class="big">U₁ / U₂ = N₁ / N₂ = I₂ / I₁ = ü</div>
    <ul><li><b>Spannung</b> und <b>Windungen</b> gehören zusammen: mehr Windungen → mehr Spannung.</li>
    <li>Beim <b>Strom</b> ist es <b>umgekehrt</b>: Die Seite mit mehr Spannung hat weniger Strom.</li>
    <li><b>ü</b> heißt Übersetzungsverhältnis. Es sagt, wie stark der Trafo die Spannung herunter- oder hochsetzt.</li></ul>`
    +merk('Viele Windungen = hohe Spannung = kleiner Strom.')),
  Q('Tafel','Wie lautet die Formel für das Übersetzungsverhältnis?','Welche Formel ist richtig?','U₁/U₂ = N₁/N₂ = I₂/I₁',['U₁/U₂ = N₂/N₁ = I₁/I₂','U₁/U₂ = N₁/N₂ = I₁/I₂','U₁ · U₂ = N₁ · N₂'],
    'Beim Strom ist es umgekehrt: I₂ steht oben.','ü = U₁/U₂ = N₁/N₂ = I₂/I₁'),
  Q('Aufgabe 1a','Steckernetzteil 230 V / 24 V, sekundär 30 Windungen. a) Übersetzungsverhältnis?','Wie groß ist ü?','ü ≈ 9,58',['ü ≈ 0,104','ü = 206','ü = 7,67'],
    'ü = U₁ / U₂ = 230 V / 24 V ≈ 9,58','Geg.: U₁ = 230 V; U₂ = 24 V; N₂ = 30 · Ges.: ü, N₁<br>ü = U₁ / U₂ = 230 V / 24 V ≈ 9,58'),
  Q('Aufgabe 1b','b) die Windungszahl der Primärwicklung','Wie viele Windungen hat die Primärspule (N₁)?','N₁ ≈ 288',['N₁ ≈ 3','N₁ = 30','N₁ ≈ 767'],
    'N₁ = N₂ · ü = 30 · 9,58 ≈ 287,5 → 288. Primär ist die Spannung höher, also braucht sie mehr Windungen.','N₁ = N₂ · U₁ / U₂ = 30 · 230 V / 24 V ≈ 288'),
  Q('Aufgabe 2a','Idealer Trafo: 120 VA, U₂ = 9,2 V, ü = 25, N₁ = 600. a) U₁?','Wie groß ist die Eingangsspannung U₁?','230 V',['0,37 V','34,2 V','2300 V'],
    'U₁ = ü · U₂ = 25 · 9,2 V = 230 V','U₁ = ü · U₂ = 25 · 9,2 V = 230 V'),
  Q('Aufgabe 2b','b) Windungszahl N₂','Wie viele Windungen hat die Sekundärspule (N₂)?','24',['15 000','625','240'],
    'N₂ = N₁ / ü = 600 / 25 = 24. Sekundär ist die Spannung klein, also wenige Windungen.','N₂ = N₁ / ü = 600 / 25 = 24'),
  L('Ströme ausrechnen mit der Leistung',`<p>Beim idealen Trafo ist die <b>Leistung</b> vorne und hinten gleich groß: <span class="f">S = U · I</span></p>
    <p>Wenn du die Leistung kennst, bekommst du den Strom so:</p><div class="big">I = S / U</div>`),
  Q('Aufgabe 2c','c) Strom I₂','Wie groß ist I₂? (S = 120 VA, U₂ = 9,2 V)','≈ 13,04 A',['≈ 0,52 A','1104 A','≈ 0,077 A'],
    'I₂ = S / U₂ = 120 VA / 9,2 V ≈ 13,04 A','I₂ = S / U₂ = 120 VA / 9,2 V ≈ 13,04 A'),
  Q('Aufgabe 2d','d) Strom I₁','Wie groß ist I₁? (S = 120 VA, U₁ = 230 V)','≈ 0,52 A',['≈ 13,04 A','27 600 A','≈ 1,92 A'],
    'I₁ = S / U₁ = 120 VA / 230 V ≈ 0,52 A. Hohe Spannung → kleiner Strom.','I₁ = S / U₁ = 120 VA / 230 V ≈ 0,52 A'),
  L('Extra: Stromkosten',`<ol class="steps"><li><span>Leistung in <b>kW</b> umrechnen: 900 W = 0,9 kW</span></li>
    <li><span>Energie: <span class="f">W = P · t</span> = 0,9 kW · 0,5 h = 0,45 kWh</span></li>
    <li><span>Kosten: 0,45 kWh · 42 ct/kWh = <b>18,9 ct</b></span></li></ol>`),
  Q('Extra','Staubsauger 900 W, eine halbe Stunde, 42 ct pro kWh. Wie viel kostet es?','Was kostet eine halbe Stunde Saugen?','18,9 ct',['37,8 ct','18 900 ct','189 €'],
    '0,9 kW · 0,5 h = 0,45 kWh. 0,45 · 42 ct = 18,9 ct. Wer 37,8 ct hat, hat die halbe Stunde vergessen.','W = P · t = 0,9 kW · 0,5 h = 0,45 kWh · Kosten = 0,45 kWh · 42 ct/kWh = 18,9 ct'),
]},
{id:'b135',nr:'13.5',title:'Übersetzungen und Spartransformator',steps:[
  L('So gehst du bei Trafo-Aufgaben vor',`<ol class="steps"><li><span>Geg. und Ges. aufschreiben.</span></li>
    <li><span><b>ü</b> = U₁ / U₂</span></li><li><span><b>Ströme</b> über die Leistung: I = S / U</span></li>
    <li><span><b>Windungen:</b> N₂ = N₁ · U₂ / U₁ (Windungen verhalten sich wie Spannungen)</span></li></ol>
    <p>Beispiel: 500 VA, 230 V → 24 V, N₁ = 470</p>`),
  Q('Aufgabe 5a','500 VA, 230 V → 24 V, N₁ = 470. a) Übersetzungsverhältnis','ü = ?','≈ 9,58',['≈ 0,104','19,6','2,13'],'ü = 230 V / 24 V ≈ 9,58','ü = U₁ / U₂ = 230 V / 24 V ≈ 9,58'),
  Q('Aufgabe 5b','b) Eingangsstrom','I₁ = ?','≈ 2,17 A',['≈ 20,83 A','115 000 A','≈ 0,46 A'],'I₁ = S / U₁ = 500 VA / 230 V ≈ 2,17 A','I₁ = S / U₁ = 500 VA / 230 V ≈ 2,17 A'),
  Q('Aufgabe 5c','c) Ausgangsstrom','I₂ = ?','≈ 20,83 A',['≈ 2,17 A','12 000 A','≈ 0,048 A'],'I₂ = S / U₂ = 500 VA / 24 V ≈ 20,83 A. Kleine Spannung → großer Strom.','I₂ = S / U₂ = 500 VA / 24 V ≈ 20,83 A'),
  Q('Aufgabe 5d','d) Ausgangswindungszahl','N₂ = ?','≈ 49',['≈ 4504','470','≈ 9,58'],'N₂ = N₁ · U₂ / U₁ = 470 · 24 / 230 ≈ 49','N₂ = N₁ · U₂ / U₁ = 470 · 24 V / 230 V ≈ 49'),
  L('Der Spartransformator',`<p>Ein Spartrafo hat nur <b>eine Wicklung</b>. Ein Teil davon wird für Eingang und Ausgang gemeinsam benutzt.</p>
    <ul><li><b>Vorteil:</b> weniger Kupfer und Eisen → <b>kleiner, leichter, billiger</b>.</li>
    <li><b>Nachteil:</b> Eingang und Ausgang sind verbunden → <b>keine galvanische Trennung</b>.</li>
    <li><b>Einsatz:</b> Spannung anpassen, z. B. 400 V → 230 V, oder als Stelltrafo.</li>
    <li><b>Verboten</b>, wo Sicherheit wichtig ist: Schutzkleinspannung (Klingeltrafo, Spielzeugtrafo) und Trenntrafo.</li></ul>`
    +merk('Spartrafo = spart Material, aber keine Trennung.')),
  Q('Aufgabe 6','Nennen Sie einen Vorteil von Spartransformatoren.','Was ist ein Vorteil?','Kleiner, leichter und billiger',['Galvanische Trennung','Funktioniert mit Gleichspannung','Braucht keinen Eisenkern'],'Man spart Material, weil ein Teil der Wicklung doppelt genutzt wird.','Vorteil: kleiner, leichter, billiger (weniger Kupfer und Eisen).'),
  Q('Aufgabe 6','Nennen Sie einen Nachteil von Spartransformatoren.','Was ist der Nachteil?','Keine galvanische Trennung',['Sehr schwer','Sehr teuer','Nur für Gleichspannung'],'Eingang und Ausgang hängen an derselben Wicklung, also sind sie elektrisch verbunden.','Nachteil: keine galvanische Trennung zwischen Eingang und Ausgang.'),
  Q('Aufgabe 7a','Nennen Sie ein Beispiel, wo Spartransformatoren eingesetzt werden.','Wo darf man einen Spartrafo benutzen?','Zum Anpassen von 400 V auf 230 V',['Als Klingeltrafo','Als Spielzeugtrafo','Als Trenntrafo im Bad'],'Hier geht es nur darum, die Spannung etwas zu ändern. Eine Trennung ist nicht nötig.','z. B. Anpassung 400 V / 230 V, Stelltransformator'),
  Q('Aufgabe 7b','Nennen Sie ein Beispiel, wo keine Spartransformatoren verwendet werden dürfen.','Wo ist ein Spartrafo verboten?','Bei Schutzkleinspannung, z. B. Klingel- oder Spielzeugtrafo',['Beim Anpassen von 400 V auf 230 V','Als Stelltrafo im Labor','Beim Anlassen von Motoren'],'Ohne Trennung könnte gefährliche Netzspannung am Ausgang anliegen.','Bei Sicherheitstransformatoren für Schutzkleinspannung (Klingel-, Spielzeugtrafo) und Trenntransformatoren.'),
  L('Durchgangsleistung und Bauleistung',`<ul><li><b>Durchgangsleistung S_D:</b> die ganze Leistung, die von vorne nach hinten zur Last geht.</li>
    <li><b>Bauleistung S_B:</b> nur der Teil, der wirklich über das Magnetfeld übertragen wird. Davon hängt ab, wie groß der Trafo gebaut werden muss.</li></ul>
    <div class="big">S_B = S_D · (U₁ − U₂) / U₁</div>`),
  Q('Aufgabe 8a','Was versteht man unter der Durchgangsleistung S_D?','Was ist die Durchgangsleistung?','Die gesamte Leistung, die zur Last übertragen wird',['Nur die Leistung im Magnetfeld','Die Verlustleistung','Die Leistung ohne Last'],'Durchgang = alles, was durchgeht.','Die gesamte vom Eingang zum Ausgang übertragene Leistung (S_D = U₂ · I₂).'),
  Q('Aufgabe 8b','Was versteht man unter der Bauleistung S_B?','Was ist die Bauleistung?','Der Teil, der über das Magnetfeld übertragen wird; er bestimmt die Baugröße',['Die gesamte Leistung zur Last','Die Leistung beim Einschalten','Das Gewicht des Trafos'],'Bau = so groß muss man ihn bauen.','Der Teil der Leistung, der transformatorisch übertragen wird. Er bestimmt die Baugröße.'),
  Q('Aufgabe 9a','Spartrafo 400/230 V, S_D = 480 VA, η = 0,9. a) Bauleistung','S_B = ?','204 VA',['480 VA','276 VA','533 VA'],'S_B = 480 VA · (400 − 230) / 400 = 480 · 170 / 400 = 204 VA','S_B = S_D · (U₁ − U₂) / U₁ = 480 VA · 170 V / 400 V = 204 VA'),
  Q('Aufgabe 9b','b) Eingangsstrom','I₁ = ?','≈ 1,33 A',['1,2 A','≈ 2,09 A','≈ 0,75 A'],'Zuerst die aufgenommene Leistung: 480 VA / 0,9 ≈ 533 VA. Dann I₁ = 533 VA / 400 V ≈ 1,33 A. (Ohne Wirkungsgrad wären es 1,2 A, vergleiche mit deinem Heft.)','S₁ = S_D / η ≈ 533 VA · I₁ = S₁ / U₁ ≈ 1,33 A'),
  Q('Aufgabe 9c','c) Ausgangsstrom','I₂ = ?','≈ 2,09 A',['≈ 1,33 A','≈ 0,48 A','110 400 A'],'I₂ = S_D / U₂ = 480 VA / 230 V ≈ 2,09 A','I₂ = S_D / U₂ = 480 VA / 230 V ≈ 2,09 A'),
]},
{id:'b136',nr:'13.6',title:'Berechnungen am Trafo (Nr. 1–8)',steps:[
  L('Das Rezept für alle 8 Aufgaben',`<div class="big">U₁ / U₂ = N₁ / N₂ = I₂ / I₁</div>
    <ol class="steps"><li><span>Schau, welche zwei <b>Paare</b> du hast (U, N oder I).</span></li>
    <li><span><b>U und N</b> verhalten sich <b>gleich</b>: U₂ = U₁ · N₂ / N₁</span></li>
    <li><span><b>I</b> ist <b>umgekehrt</b>: I₂ = I₁ · N₁ / N₂ oder I₂ = I₁ · U₁ / U₂</span></li>
    <li><span><b>Kontrolle:</b> Hat die Seite mit mehr Windungen auch mehr Spannung und weniger Strom?</span></li></ol>`),
  Q('Nr. 1','N₁ = 1000, N₂ = 435, U₁ = 230 V, U₂ = ?','U₂ = ?','100,05 V',['528,7 V','43,5 V','230 V'],'U₂ = U₁ · N₂ / N₁ = 230 V · 435 / 1000 = 100,05 V','U₂ = 230 V · 435 / 1000 = 100,05 V'),
  Q('Nr. 2','N₁ = 880, N₂ = 500, U₂ = 24 V, U₁ = ?','U₁ = ?','42,24 V',['13,64 V','22,96 V','24 V'],'U₁ = U₂ · N₁ / N₂ = 24 V · 880 / 500 = 42,24 V. Achtung: In deinem Heft steht „/ 920“, das ist falsch. Es muss / 500 heißen.','U₁ = 24 V · 880 / 500 = 42,24 V'),
  Q('Nr. 3','I₂ = 1 A, U₁ = 230 V, U₂ = 12 V, I₁ = ?','I₁ = ?','≈ 0,052 A (52 mA)',['≈ 19,2 A','1 A','12 A'],'I₁ = I₂ · U₂ / U₁ = 1 A · 12 V / 230 V ≈ 0,052 A. Die 230-V-Seite hat den kleinen Strom.','I₁ = 1 A · 12 V / 230 V ≈ 0,052 A'),
  Q('Nr. 4','I₁ = 10 A, U₁ = 20 kV, U₂ = 230 V, I₂ = ?','I₂ = ?','≈ 869,57 A',['≈ 0,115 A','10 A','46 000 A'],'20 kV = 20 000 V. I₂ = I₁ · U₁ / U₂ = 10 A · 20 000 V / 230 V ≈ 869,57 A','I₂ = 10 A · 20 000 V / 230 V ≈ 869,57 A'),
  Q('Nr. 5','N₁ = 2300, N₂ = 80, I₁ = 1 A, I₂ = ?','I₂ = ?','28,75 A',['≈ 0,035 A','1 A','2220 A'],'I₂ = I₁ · N₁ / N₂ = 1 A · 2300 / 80 = 28,75 A. Wenige Windungen → großer Strom.','I₂ = 1 A · 2300 / 80 = 28,75 A'),
  Q('Nr. 6','N₂ = 800, I₁ = 10 A, I₂ = 500 mA, N₁ = ?','N₁ = ?','40',['16 000','400','8000'],'500 mA = 0,5 A. N₁ = N₂ · I₂ / I₁ = 800 · 0,5 A / 10 A = 40','N₁ = 800 · 0,5 A / 10 A = 40'),
  Q('Nr. 7','N₁ = 700, U₁ = 230 V, U₂ = 46 V, N₂ = ?','N₂ = ?','140',['3500','46','700'],'N₂ = N₁ · U₂ / U₁ = 700 · 46 V / 230 V = 140','N₂ = 700 · 46 V / 230 V = 140'),
  Q('Nr. 8','N₁ = 750, N₂ = 100, I₂ = 5 A, I₁ = ?','I₁ = ?','≈ 0,67 A',['37,5 A','5 A','≈ 0,13 A'],'I₁ = I₂ · N₂ / N₁ = 5 A · 100 / 750 ≈ 0,67 A','I₁ = 5 A · 100 / 750 ≈ 0,67 A'),
]},
{id:'praefix',nr:'Präfixe',title:'Vorsätze: kilo, milli, mikro …',steps:[
  L('Die Vorsätze',`<div class="scroll"><table class="tt"><tr><th>Name</th><th>Zeichen</th><th>Faktor</th></tr>
    <tr><td>Giga</td><td>G</td><td>10⁹ = 1 000 000 000</td></tr><tr><td>Mega</td><td>M</td><td>10⁶ = 1 000 000</td></tr><tr><td>Kilo</td><td>k</td><td>10³ = 1000</td></tr>
    <tr><td>Milli</td><td>m</td><td>10⁻³ = 0,001</td></tr><tr><td>Mikro</td><td>µ</td><td>10⁻⁶ = 0,000 001</td></tr><tr><td>Nano</td><td>n</td><td>10⁻⁹</td></tr>
    <tr><td>Piko</td><td>p</td><td>10⁻¹²</td></tr><tr><td>Femto</td><td>f</td><td>10⁻¹⁵</td></tr></table></div>`
    +merk('Die Hochzahl springt immer um 3. Großes M = Mega (riesig), kleines m = milli (winzig).')),
  Q('Präfixe','Mega','Was bedeutet M (Mega)?','10⁶ = 1 000 000',['10³ = 1000','10⁻³ = 0,001','10⁹'],'Mega = Million.','M = 10⁶'),
  Q('Präfixe','milli','Was bedeutet m (milli)?','10⁻³ = 0,001',['10³ = 1000','10⁻⁶','10⁶'],'Milli = Tausendstel. 1 mm = 0,001 m.','m = 10⁻³'),
  Q('Präfixe','Mikro','Welches Zeichen hat Mikro?','µ',['m','M','n'],'µ ist ein griechischer Buchstabe (my). Mikro = 10⁻⁶.','µ = 10⁻⁶'),
  Q('Präfixe','Nano','Was bedeutet n (nano)?','10⁻⁹',['10⁹','10⁻⁶','10⁻¹²'],'Nano = Milliardstel.','n = 10⁻⁹'),
  Q('Präfixe','Giga','Was bedeutet G (Giga)?','10⁹',['10⁶','10¹²','10⁻⁹'],'Giga = Milliarde, wie bei Gigabyte.','G = 10⁹'),
  Q('Präfixe','Piko / Femto','Was ist kleiner?','f (femto) = 10⁻¹⁵',['p (piko) = 10⁻¹²'],'Je negativer die Hochzahl, desto kleiner. −15 ist kleiner als −12.','p = 10⁻¹², f = 10⁻¹⁵'),
  Q('Umrechnen','500 mA = ? A','500 mA sind wie viel Ampere?','0,5 A',['500 000 A','5 A','0,05 A'],'milli heißt durch 1000 teilen: 500 / 1000 = 0,5','500 mA = 0,5 A'),
  Q('Umrechnen','20 mm = ? m','20 mm sind wie viel Meter?','0,02 m',['0,2 m','2 m','20 000 m'],'20 / 1000 = 0,02. Das brauchst du bei F = I · B · l!','20 mm = 0,02 m'),
  Q('Umrechnen','20 kV = ? V','20 kV sind wie viel Volt?','20 000 V',['0,02 V','200 V','2000 V'],'kilo heißt mal 1000: 20 · 1000 = 20 000','20 kV = 20 000 V'),
  Q('Umrechnen','0,048 A = ? mA','0,048 A sind wie viel Milliampere?','48 mA',['0,000 048 mA','4,8 mA','480 mA'],'In mA umrechnen heißt mal 1000: 0,048 · 1000 = 48','0,048 A = 48 mA'),
]},
];

/* ================= Ablauf ================= */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LS='ab-magnet-v2';
let DB={}; try{ DB=JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){}
const save=()=>{ try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){} };
DB.pos=DB.pos||{}; DB.first=DB.first||{};

const main=document.getElementById('main'), tabs=document.getElementById('tabs');
let cur=null, idx=0;

function tasksOf(sh){ return sh.steps.map((s,i)=>i).filter(i=>sh.steps[i].t!=='L'); }
function pct(sh){ const ts=tasksOf(sh); const f=DB.first[sh.id]||{}; const done=ts.filter(i=>i in f); if(!done.length) return ''; return ' ✓'+done.filter(i=>f[i]).length+'/'+ts.length; }
function refreshTabs(){ tabs.querySelectorAll('.tab').forEach(t=>{ const sh=SHEETS.find(s=>s.id===t.dataset.id); t.querySelector('.pc').textContent=pct(sh); t.setAttribute('aria-selected',cur&&t.dataset.id===cur.id); }); }
function setProg(){
  const n=cur.steps.length;
  document.getElementById('prog-t').textContent = idx<n ? `Blatt ${cur.nr} · Schritt ${idx+1} von ${n}` : `Blatt ${cur.nr} · fertig`;
  document.getElementById('prog-b').style.width=(Math.min(idx+1,n)/n*100)+'%';
}
function record(ok){ const f=DB.first[cur.id]=DB.first[cur.id]||{}; if(!(idx in f)){ f[idx]=ok; save(); refreshTabs(); } }

function navHTML(nextLabel,nextDisabled){
  return `<div class="nav">${idx>0?'<button class="btn ghost" id="prev">← Zurück</button>':''}<button class="btn" id="next"${nextDisabled?' disabled':''}>${nextLabel}</button></div>`;
}
function wireNav(){
  const p=document.getElementById('prev'); if(p) p.onclick=()=>go(idx-1);
  document.getElementById('next').onclick=()=>go(idx+1);
}
function go(i){ idx=Math.max(0,i); DB.pos[cur.id]=idx; save(); render(); window.scrollTo(0,0); }

function render(){
  setProg();
  if(idx>=cur.steps.length) return renderDone();
  const st=cur.steps[idx];
  if(st.t==='L'){
    main.innerHTML=`<article class="card"><span class="eyebrow learn">Erklärung</span><h2>${st.title}</h2>${st.html}${navHTML('Verstanden, weiter →')}</article>`;
    wireNav(); return;
  }
  const origBox=`<div class="orig"><b>${st.blatt} · Auf dem Arbeitsblatt steht</b>${st.orig}</div>`;
  if(st.t==='Q'){
    const opts=shuffle([{t:st.right,ok:true},...st.wrong.map(t=>({t}))]);
    main.innerHTML=`<article class="card"><span class="eyebrow">Aufgabe zum Antippen</span>${origBox}<p class="qs">${st.q}</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div id="fb"></div>${navHTML('Weiter →',true)}</article>`;
    main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];
      main.querySelectorAll('.opt').forEach((x,j)=>{ x.disabled=true; if(opts[j].ok) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); });
      record(!!o.ok);
      document.getElementById('fb').innerHTML=`<div class="fb ${o.ok?'ok':'no'}"><h3>${o.ok?'Richtig!':'Nicht ganz. Richtig ist: '+st.right}</h3><p>${st.why}</p>${st.write?`<div class="write"><b class="h">So schreibst du es aufs Blatt</b>${st.write}</div>`:''}</div>`;
      document.getElementById('next').disabled=false;
      document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
    });
    wireNav(); return;
  }
  // Zeichenaufgabe
  const def=st.fig(); const state={};
  let svg=`<svg viewBox="0 0 ${def.w} ${def.h}" role="img" aria-label="${def.cap}">${def.base}<g class="solg">${def.sol}</g>`;
  (def.zones||[]).forEach(z=>{ svg+=`<g class="zone" data-z="${z.k}" data-g="${z.g}" tabindex="0" role="button"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="6"/><text x="${z.x+z.w/2}" y="${z.y+14}" text-anchor="middle">${z.lab}</text></g>`; });
  def.chips.forEach(c=>{ const bg=c.wide?`<rect class="bg" x="-50" y="-13" width="100" height="26" rx="13"/>`:`<circle class="bg" r="15"/><circle r="22" fill="transparent"/>`; svg+=`<g class="chip" data-k="${c.k}" transform="translate(${c.x} ${c.y})" tabindex="0" role="button">${bg}<g class="gl">${chipGlyph('?')}</g></g>`; });
  svg+='</svg>';
  main.innerHTML=`<article class="card"><span class="eyebrow">Zeichenaufgabe zum Antippen</span>${origBox}<p class="qs">${st.q}</p>
    <div class="fig" id="fig"><span class="cap">${def.cap}</span><div class="fwrap">${svg}</div></div>
    <div class="nav"><button class="btn" id="check">Prüfen</button><button class="btn ghost" id="tip">Ich weiß nicht weiter: Tipp zeigen</button></div>
    <div id="tipbox" hidden><div class="merk"><b class="h">So gehst du vor</b><ol class="steps">${st.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol></div></div>
    <div id="fb"></div>${navHTML('Weiter →',true)}</article>`;
  const root=document.getElementById('fig');
  const clear=()=>root.querySelectorAll('.chip,.zone').forEach(g=>g.classList.remove('ok','bad'));
  root.querySelectorAll('.chip').forEach(g=>{
    const c=def.chips.find(x=>x.k===g.dataset.k); const cyc=Array.isArray(c.c)?c.c:CYC[c.c];
    const act=()=>{ if(root.classList.contains('showsol')) return; const v=state[c.k]||'?'; const nx=cyc[(cyc.indexOf(v)+1)%cyc.length]; state[c.k]=nx; g.querySelector('.gl').innerHTML=chipGlyph(nx); clear(); };
    g.onclick=act; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();act();} };
  });
  root.querySelectorAll('.zone').forEach(g=>{
    const act=()=>{ if(root.classList.contains('showsol')) return; state['z:'+g.dataset.g]=g.dataset.z; root.querySelectorAll(`.zone[data-g="${g.dataset.g}"]`).forEach(o=>{ const on=o===g; o.classList.toggle('on',on); o.querySelector('text').textContent=on?'verstärkt':def.zones.find(z=>z.k===o.dataset.z).lab; }); clear(); };
    g.onclick=act; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();act();} };
  });
  document.getElementById('tip').onclick=()=>{ document.getElementById('tipbox').hidden=false; document.getElementById('tip').hidden=true; };
  document.getElementById('check').onclick=()=>{
    let all=true;
    def.chips.forEach(c=>{ const ok=(state[c.k]||'?')===c.a; all=all&&ok; const g=root.querySelector(`.chip[data-k="${c.k}"]`); g.classList.toggle('ok',ok); g.classList.toggle('bad',!ok); });
    const groups={}; (def.zones||[]).forEach(z=>{ (groups[z.g]=groups[z.g]||[]).push(z); });
    Object.entries(groups).forEach(([gname,zs])=>{ const right=zs.find(z=>z.a).k; const ok=state['z:'+gname]===right; all=all&&ok; const el=root.querySelector(`.zone[data-z="${right}"]`); el.classList.add(ok?'ok':'bad'); });
    record(all);
    const fb=document.getElementById('fb');
    if(all){
      root.classList.add('showsol');
      fb.innerHTML=`<div class="fb ok"><h3>Richtig! So sieht die fertige Zeichnung aus:</h3><p>${def.explain}</p></div>`;
      document.getElementById('check').hidden=true; document.getElementById('next').disabled=false;
    } else {
      fb.innerHTML=`<div class="fb no"><h3>Noch nicht ganz.</h3><p>Die <b>rot</b> umrandeten Felder stimmen noch nicht. Tippe sie nochmal an, oder schau dir die Lösung an.</p><div class="nav"><button class="btn ghost" id="showsol">Lösung zeigen</button></div></div>`;
      document.getElementById('tipbox').hidden=false; document.getElementById('tip').hidden=true;
      document.getElementById('showsol').onclick=()=>{ root.classList.add('showsol'); fb.innerHTML=`<div class="fb ok"><h3>Die Lösung (in Pink):</h3><p>${def.explain}</p></div>`; document.getElementById('check').hidden=true; document.getElementById('next').disabled=false; };
    }
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  wireNav();
}

function renderDone(){
  const ts=tasksOf(cur), f=DB.first[cur.id]||{}, r=ts.filter(i=>f[i]).length;
  const p=r/ts.length, st=p>=.9?3:p>=.7?2:p>=.4?1:0;
  const ni=SHEETS.indexOf(cur)+1;
  main.innerHTML=`<article class="card done"><div class="stars">${[0,1,2].map(i=>`<span class="${i<st?'on':''}">★</span>`).join('')}</div>
    <h2>Blatt ${cur.nr} geschafft!</h2><p>${r} von ${ts.length} Aufgaben beim ersten Versuch richtig.</p>
    <div class="nav">${ni<SHEETS.length?`<button class="btn" id="nextsheet">Nächstes Blatt: ${SHEETS[ni].nr} →</button>`:''}<button class="btn ghost" id="again">Blatt nochmal machen</button></div></article>`;
  const ns=document.getElementById('nextsheet'); if(ns) ns.onclick=()=>open(SHEETS[ni].id,true);
  document.getElementById('again').onclick=()=>{ delete DB.first[cur.id]; save(); refreshTabs(); go(0); };
}

function open(id,fresh){
  cur=SHEETS.find(s=>s.id===id)||SHEETS[0];
  idx=fresh?0:(DB.pos[cur.id]||0);
  if(idx>cur.steps.length) idx=0;
  try{ localStorage.setItem(LS+'-tab',cur.id); }catch(e){}
  refreshTabs(); render(); window.scrollTo(0,0);
}
tabs.innerHTML=SHEETS.map(s=>`<button class="tab" role="tab" data-id="${s.id}">${s.nr}<span class="pc"></span></button>`).join('');
tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>open(t.dataset.id));
let startId='b51'; try{ startId=localStorage.getItem(LS+'-tab')||'b51'; }catch(e){}
open(startId);
</script>
