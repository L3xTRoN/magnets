<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schaltungslabor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: dunkles Steckbrett-Raster als Arbeitsfläche, rechts Challenge und Bauteil-Infos; mobil untereinander. */
:root{
  --paper:#EEF1EE; --card:#FFFFFF; --card2:#F5F7F3; --ink:#1B2226; --muted:#56626A; --line:#D6DCD6;
  --board:#16201F; --dot:#3C4C4A; --sym:#E8EEEA; --sel:#FFD45C;
  --vpos:#3DDC84; --vneg:#FF6B5B; --v0:#7C8A88; --flow:#FFE38A;
  --ok:#1D7F53; --ok-bg:#E0F2E8; --bad:#C23324; --bad-bg:#FBE5E2; --accent:#2743A6; --accent-soft:#E3E8F8;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px -14px rgba(20,40,60,.35);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#141A1D; --card:#1C2428; --card2:#222B30; --ink:#E7ECEA; --muted:#9AA6AB; --line:#323C41;
    --ok:#3DBB84; --ok-bg:#16352A; --bad:#F0645A; --bad-bg:#3E1F1C; --accent:#8FA6FF; --accent-soft:#27305A;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#141A1D; --card:#1C2428; --card2:#222B30; --ink:#E7ECEA; --muted:#9AA6AB; --line:#323C41;
  --ok:#3DBB84; --ok-bg:#16352A; --bad:#F0645A; --bad-bg:#3E1F1C; --accent:#8FA6FF; --accent-soft:#27305A;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.top h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:800}
.top p{color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--shadow)}
.panel h2{font-size:1.1rem}
.muted{color:var(--muted)} .small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.9rem}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.palette{display:flex;flex-wrap:wrap;gap:6px}
.tool{display:grid;justify-items:center;gap:2px;min-width:64px;padding:6px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:.78rem;font-weight:700}
.tool svg{width:40px;height:24px}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--card2)}
.tool svg .s{stroke:var(--ink);stroke-width:2;fill:none}

.board{border-radius:16px;overflow-x:auto;background:var(--board);box-shadow:var(--shadow);touch-action:manipulation}
.board svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
@media (max-width:640px){.board svg{width:560px}}
.pt{cursor:pointer}
.pt .hit{fill:transparent}
.pt .d{fill:var(--dot)}
.pt.sel .d{fill:var(--sel);r:7}
.pt:hover .d{fill:#7D918E}
.pt:focus{outline:none}.pt:focus-visible .hit{stroke:var(--sel);stroke-width:2}
.part{cursor:pointer}
.part:focus{outline:none}
.part:focus-visible .body,.part.sel .body{stroke:var(--sel);stroke-width:3}
.lead{stroke-width:4;stroke-linecap:round;fill:none}
.flow{stroke:var(--flow);stroke-width:3;stroke-dasharray:2 14;stroke-linecap:round;fill:none;opacity:.95;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.flow{animation:flow var(--dur,1s) linear infinite}.flow.rev{animation-direction:reverse}}
@keyframes flow{to{stroke-dashoffset:-32}}
.body{fill:var(--board);stroke:var(--sym);stroke-width:2}
.sym{stroke:var(--sym);stroke-width:2;fill:none}
.lbl{font:700 11px var(--mono);fill:var(--sym);pointer-events:none}
.val{font:700 11px var(--mono);fill:#C8D3CF;pointer-events:none}
.warn{font:800 13px var(--display);fill:var(--vneg);pointer-events:none}
.ghost-line{stroke:var(--sel);stroke-width:2;stroke-dasharray:5 5;pointer-events:none}

.status{min-height:1.4em;font-size:.95rem;color:var(--muted)}
.status.bad{color:var(--bad);font-weight:700}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.vals div{background:var(--card2);border-radius:10px;padding:6px 8px;display:grid}
.vals b{font:700 1.05rem var(--mono)}
.vals span{font-size:.75rem;color:var(--muted)}
label.inl{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem}
select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card);min-height:40px}
.chlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ch{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ch[aria-current="true"]{border-color:var(--ink);background:var(--card2)}
.ch .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 .85rem var(--mono);background:var(--accent-soft);color:var(--accent)}
.ch.done .n{background:var(--ok);color:#fff}
.ch b{font-size:.95rem}
.goal{border-left:5px solid var(--sel)}
.win{background:var(--ok-bg);border-color:transparent}
.win h2{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Schaltungslabor</h1><p>Frei bauen, messen, verstehen. Gleichstrom, alle Werte live.</p></header>
  <div class="stage">
    <div class="col">
      <div class="panel goal" id="goal"></div>
      <div class="palette" id="palette" role="toolbar" aria-label="Bauteile"></div>
      <div class="board" id="board"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="legend"><span><i style="background:var(--vpos)"></i>hohe Spannung (Plus)</span><span><i style="background:var(--v0)"></i>0 V (Minus)</span><span><i style="background:var(--flow)"></i>Strom fließt (technische Stromrichtung)</span></div>
      <div class="row"><button class="btn ghost sm" id="undo">Rückgängig</button><button class="btn ghost sm" id="clear">Alles löschen</button></div>
    </div>
    <div class="col">
      <div class="panel" id="info"></div>
      <div class="panel"><h2>Challenges</h2><p class="small muted" id="chprog"></p><ul class="chlist" id="chlist"></ul></div>
    </div>
  </div>
</div>
<script src="labor.js"></script>
</body>
</html>
